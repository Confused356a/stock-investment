<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="中国股票投资观察表，可按股票名称、代码、分档和价格信号搜索。"
    />
    <title>股票投资观察表</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d3328'/%3E%3Cpath d='M14 43 26 31l8 7 16-19' fill='none' stroke='%2379d6a7' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">STOCK INVESTMENT</p>
          <h1>股票投资观察表</h1>
          <p class="intro">财报估值决定参考价，历史行情用于校验，最新收盘价决定当前分档。</p>
        </div>
        <div class="as-of" aria-label="数据日期">
          <span>数据更新</span>
          <strong id="updatedDate">读取中</strong>
        </div>
      </header>

      <section class="toolbar" aria-label="股票搜索">
        <label class="search" for="stockSearch">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m21 21-4.35-4.35m2.35-5.4A7.75 7.75 0 1 1 3.5 11.25a7.75 7.75 0 0 1 15.5 0Z" />
          </svg>
          <input
            id="stockSearch"
            type="search"
            placeholder="搜索股票、代码、分档、信号或分析内容"
            autocomplete="off"
          />
          <kbd>Ctrl K</kbd>
        </label>
      </section>

      <section class="summary" aria-label="观察表概览">
        <article>
          <span>全部股票</span>
          <strong id="totalCount">—</strong>
        </article>
        <article>
          <span>绿色信号</span>
          <strong id="greenCount" class="green-text">—</strong>
        </article>
        <article>
          <span>价格偏高</span>
          <strong id="orangeCount" class="orange-text">—</strong>
        </article>
        <article>
          <span>当前显示</span>
          <strong id="visibleCount">—</strong>
        </article>
      </section>

      <div class="results-heading">
        <h2>观察清单</h2>
        <p id="resultStatus" role="status" aria-live="polite">正在读取数据…</p>
      </div>

      <section id="stockGrid" class="stock-grid" aria-label="股票列表"></section>

      <section id="emptyState" class="empty-state" hidden>
        <strong>没有找到匹配股票</strong>
        <p>换一个股票名称、代码或关键词试试。</p>
      </section>

      <section id="errorState" class="error-state" hidden>
        <strong>暂时无法读取股票数据</strong>
        <p>请通过 GitHub Pages 或静态 HTTP 服务打开此页面。</p>
      </section>

      <footer>
        本页为研究记录，不构成投资建议。历史回测结果不代表未来收益。
      </footer>
    </main>
  </body>
</html>
